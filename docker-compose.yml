services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quantmark
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      ENVIRONMENT: production
      PORT: "8080"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/quantmark
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
      STORAGE_BACKEND: minio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: quantmark-evidence
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  watcher:
    build: .
    restart: unless-stopped
    environment:
      QUANTMARK_API_URL: http://api:8080
      QUANTMARK_API_KEY: "${WATCHER_API_KEY}"
      TARGET_SERIAL_CODES: "${TARGET_SERIAL_CODES}"
      ALPACA_ENABLED: "true"
      BINANCE_ENABLED: "true"
      BRAVE_SEARCH_ENABLED: "${BRAVE_SEARCH_ENABLED:-false}"
      GITHUB_SEARCH_ENABLED: "${GITHUB_SEARCH_ENABLED:-false}"
      HUGGINGFACE_SEARCH_ENABLED: "${HUGGINGFACE_SEARCH_ENABLED:-false}"
      PASTEBIN_SEARCH_ENABLED: "${PASTEBIN_SEARCH_ENABLED:-false}"
      SCAN_INTERVAL_HOURS: "${SCAN_INTERVAL_HOURS:-6}"
      SIMULATE_INTERVAL_MINUTES: "${SIMULATE_INTERVAL_MINUTES:-5}"
      LOG_LEVEL: info
    command: python -m watcher daemon
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
