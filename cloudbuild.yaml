steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--platform=linux/amd64"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/quantmark:${SHORT_SHA}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/quantmark:${SHORT_SHA}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "quantmark-api"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/quantmark:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--concurrency=80"
      - "--timeout=300"
      - "--set-env-vars=DATABASE_URL=${_DATABASE_URL},SECRET_KEY=${_SECRET_KEY},ENVIRONMENT=production,STORAGE_BACKEND=gcs,GCS_BUCKET=${_GCS_BUCKET}"
      - "--set-secrets=STORAGE_ACCESS_KEY=quantmark-storage-key:latest"

substitutions:
  _REGION: us-central1
  _DATABASE_URL: postgresql+asyncpg://user:pass@host:5432/quantmark
  _SECRET_KEY: change-me
  _GCS_BUCKET: quantmark-certificates

options:
  logging: CLOUD_LOGGING_ONLY
