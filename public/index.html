<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>QuantMark — Registro Público de Watermark IDs</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/quantmark.css"/>
</head>
<body>
  <!-- Sidebar (visible only when logged in) -->
  <nav class="sidebar" id="sidebar" style="display:none;">
    <div style="padding:1.5rem;display:flex;flex-direction:column;gap:2px;">
      <span class="headline-sm" style="color:var(--primary);letter-spacing:-0.05em;">QuantMark</span>
      <span class="label-caps" style="color:var(--outline);opacity:0.5;font-size:10px;">V0.1.0</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;padding:0.5rem 0;">
      <a href="#/dashboard" class="sidebar-link" data-nav="dashboard">
        <span class="material-symbols-outlined">home</span>
        <span>Dashboard</span>
      </a>
      <a href="#/models" class="sidebar-link" data-nav="models">
        <span class="material-symbols-outlined">memory</span>
        <span>Models</span>
      </a>
      <a href="#/ids" class="sidebar-link" data-nav="ids">
        <span class="material-symbols-outlined">fingerprint</span>
        <span>IDs</span>
      </a>
      <a href="#/reports" class="sidebar-link" data-nav="reports">
        <span class="material-symbols-outlined">analytics</span>
        <span>Reports</span>
      </a>
    </div>
    <div style="padding:1rem;">
      <div style="display:flex;align-items:center;gap:0.75rem;background:var(--surface-glass);border:1px solid var(--border-subtle);border-radius:1rem;padding:0.75rem;">
        <div style="width:32px;height:32px;border-radius:50%;background:var(--nothing-red);display:flex;align-items:center;justify-content:center;">
          <span class="material-symbols-outlined" style="color:white;font-size:1rem;">bolt</span>
        </div>
        <div style="flex:1;min-width:0;">
          <p class="label-caps" style="font-size:9px;color:var(--primary);">API ACTIVE</p>
          <p class="mono" style="font-size:9px;color:var(--outline);" id="sidebar-company">Connected</p>
        </div>
        <span onclick="logout(); updateUI(); navigate('/');" style="color:var(--outline);text-decoration:none;cursor:pointer;">
          <span class="material-symbols-outlined" style="font-size:1.25rem;">logout</span>
        </span>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <div class="main-content" id="main-content">
    <!-- Top bar (only when logged in) -->
    <header id="topbar" style="display:none;height:64px;border-bottom:1px solid var(--border-subtle);background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);position:sticky;top:0;z-index:40;align-items:center;justify-content:space-between;padding:0 var(--container-padding);">
      <span class="mono" style="font-size:12px;color:var(--outline);">QUANTMARK / <span id="topbar-section">CONSOLE</span></span>
      <div style="display:flex;align-items:center;gap:1rem;">
        <span class="material-symbols-outlined" style="color:var(--on-surface-variant);cursor:pointer;">notifications</span>
        <span class="material-symbols-outlined" style="color:var(--on-surface-variant);cursor:pointer;" onclick="window.open('/docs','_blank')">description</span>
      </div>
    </header>

    <!-- App outlet -->
    <div id="app-outlet"></div>
  </div>

  <!-- Scripts -->
  <script>
    // Config: cambiar esta URL por la de tu backend en producción
    window.QUANTMARK_API = 'http://localhost:8769';
  </script>
  <script src="js/api.js"></script>
  <script src="js/router.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/register.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/search.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/models.js"></script>
  <script src="js/pages/ids.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/analytics.js"></script>
  <script src="js/pages/report.js"></script>
  <script>
    // Sidebar + topbar visibility based on auth
    function updateUI() {
      const loggedIn = isLoggedIn();
      document.getElementById('sidebar').style.display = loggedIn ? 'flex' : 'none';
      document.getElementById('topbar').style.display = loggedIn ? 'flex' : 'none';
      document.getElementById('main-content').style.marginLeft = loggedIn ? '' : '0';
      if (loggedIn) {
        const company = getCompany();
        document.getElementById('sidebar-company').textContent = company?.name || 'Connected';
      }
    }

    // Override navigate to update UI
    const origNavigate = navigate;
    window.navigate = function(path) {
      updateUI();
      origNavigate(path);
    };

    // Mark active nav link
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.slice(1) || '/';
      document.querySelectorAll('.sidebar-link').forEach(a => {
        const nav = a.dataset.nav;
        a.classList.toggle('active', nav && hash.startsWith('/' + nav));
      });
      const section = hash.split('/')[1] || 'home';
      const el = document.getElementById('topbar-section');
      if (el) el.textContent = section.toUpperCase();
    });

    // Init
    initRouter();
    updateUI();


  </script>
</body>
</html>
